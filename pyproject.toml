[project]
name = "form-filler"
version = "0.1.0"
description = "Local, on-prem form filler: extracts values from source documents and writes them into forms."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "pymupdf>=1.24",
  "pypdf>=4.2",
  "python-docx>=1.1",
  "lxml>=5.2",
  "rank-bm25>=0.2.2",
  "rapidfuzz>=3.9",
  "numpy>=1.26",
  "pillow>=10.3",
  "pytesseract>=0.3.10",
  "opencv-python-headless>=4.10",
  "python-dateutil>=2.9",
]

[project.optional-dependencies]
docling = ["docling>=2.5"]
paddle = ["paddleocr>=2.8", "paddlepaddle>=2.6"]

[dependency-groups]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "reportlab>=4.2"]

[project.scripts]
form-filler = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
